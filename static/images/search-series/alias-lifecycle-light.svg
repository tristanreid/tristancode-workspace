<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 430" width="790" height="430" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <pattern id="grid-sm-alias-l" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(37,99,235,0.04)" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-lg-alias-l" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-sm-alias-l)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(37,99,235,0.08)" stroke-width="1"/>
    </pattern>
    <marker id="arrow-alias-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#2563eb" stroke-width="1.4"/>
    </marker>
    <marker id="arrow-alias-dim-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b0b0bc" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="790" height="430" fill="#ffffff"/>
  <rect width="790" height="430" fill="url(#grid-lg-alias-l)"/>

  <!-- Column headers -->
  <g font-size="10" fill="#6a6a78" font-weight="600" letter-spacing="0.08em">
    <text x="170" y="26" text-anchor="middle">LOGICAL NAME</text>
    <text x="405" y="26" text-anchor="middle">PHYSICAL INDEX</text>
    <text x="645" y="26" text-anchor="middle">PHYSICAL INDEX</text>
  </g>

  <!-- ============ STAGE 1 ============ -->
  <text x="24" y="70" font-size="10" fill="#6a6a78" font-weight="600" letter-spacing="0.06em">1 · STEADY STATE</text>
  <rect x="110" y="82" width="120" height="38" rx="19" fill="#eef3fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="106" text-anchor="middle" font-size="12" fill="#1a1a24" font-family="ui-monospace, monospace">documents</text>
  <path d="M232,101 L308,101" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-alias-l)"/>
  <rect x="310" y="82" width="190" height="38" rx="6" fill="#f6f8fc" stroke="#2563eb"/>
  <text x="405" y="99" text-anchor="middle" font-size="11" fill="#1a1a24" font-family="ui-monospace, monospace">documents_idx_0301</text>
  <text x="405" y="113" text-anchor="middle" font-size="10" fill="#2563eb">serving</text>

  <!-- ============ STAGE 2 ============ -->
  <text x="24" y="200" font-size="10" fill="#6a6a78" font-weight="600" letter-spacing="0.06em">2 · BUILD, UNSEEN</text>
  <rect x="110" y="212" width="120" height="38" rx="19" fill="#eef3fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="236" text-anchor="middle" font-size="12" fill="#1a1a24" font-family="ui-monospace, monospace">documents</text>
  <path d="M232,231 L308,231" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-alias-l)"/>
  <rect x="310" y="212" width="190" height="38" rx="6" fill="#f6f8fc" stroke="#2563eb"/>
  <text x="405" y="229" text-anchor="middle" font-size="11" fill="#1a1a24" font-family="ui-monospace, monospace">documents_idx_0301</text>
  <text x="405" y="243" text-anchor="middle" font-size="10" fill="#2563eb">still serving</text>
  <rect x="550" y="212" width="190" height="38" rx="6" fill="#fafafa" stroke="#b0b0bc" stroke-dasharray="4 3"/>
  <text x="645" y="229" text-anchor="middle" font-size="11" fill="#6a6a78" font-family="ui-monospace, monospace">documents_idx_0308</text>
  <text x="645" y="243" text-anchor="middle" font-size="10" fill="#6a6a78">loading · no replicas · no refresh</text>

  <!-- ============ STAGE 3 ============ -->
  <text x="24" y="330" font-size="10" fill="#6a6a78" font-weight="600" letter-spacing="0.06em">3 · ONE ATOMIC SWAP</text>
  <rect x="110" y="342" width="120" height="38" rx="19" fill="#eef3fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="170" y="366" text-anchor="middle" font-size="12" fill="#1a1a24" font-family="ui-monospace, monospace">documents</text>
  <rect x="310" y="342" width="190" height="38" rx="6" fill="#fafafa" stroke="#b0b0bc"/>
  <text x="405" y="359" text-anchor="middle" font-size="11" fill="#6a6a78" font-family="ui-monospace, monospace">documents_idx_0301</text>
  <text x="405" y="373" text-anchor="middle" font-size="10" fill="#6a6a78">kept for rollback</text>
  <rect x="550" y="342" width="190" height="38" rx="6" fill="#f6f8fc" stroke="#2563eb"/>
  <text x="645" y="359" text-anchor="middle" font-size="11" fill="#1a1a24" font-family="ui-monospace, monospace">documents_idx_0308</text>
  <text x="645" y="373" text-anchor="middle" font-size="10" fill="#2563eb">serving</text>
  <!-- alias arrow routes under the old index to the new one -->
  <path d="M170,382 C170,412 400,412 645,412 L645,384" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-alias-l)"/>

  <!-- Caption -->
  <text x="24" y="424" font-size="10" fill="#6a6a78" font-style="italic">Readers only ever hold the logical name. Only step 3 is atomic.</text>
</svg>
