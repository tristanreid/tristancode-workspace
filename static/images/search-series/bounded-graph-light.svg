<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 400" width="790" height="400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <pattern id="grid-sm-bg-l" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(37,99,235,0.04)" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-lg-bg-l" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-sm-bg-l)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(37,99,235,0.08)" stroke-width="1"/>
    </pattern>
    <marker id="arrow-bg-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#2563eb" stroke-width="1.3"/>
    </marker>
    <marker id="arrow-bg-dim-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b0b0bc" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="790" height="400" fill="#ffffff"/>
  <rect width="790" height="400" fill="url(#grid-lg-bg-l)"/>

  <!-- generation labels -->
  <g font-size="9.5" fill="#6a6a78" letter-spacing="0.05em">
    <text x="88" y="52" text-anchor="middle">AUTHORITATIVE</text>
    <text x="230" y="52" text-anchor="middle">GENERATION 0</text>
    <text x="372" y="52" text-anchor="middle">GENERATION 1</text>
    <text x="514" y="52" text-anchor="middle">GENERATION 2</text>
    <text x="700" y="52" text-anchor="middle">BEYOND THE GATE</text>
  </g>

  <!-- nodes -->
  <rect x="30" y="64" width="116" height="52" rx="8" fill="#eef3fe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="88" y="86" text-anchor="middle" font-size="11.5" fill="#1a1a24" font-weight="600">Structured</text>
  <text x="88" y="102" text-anchor="middle" font-size="11.5" fill="#1a1a24" font-weight="600">source</text>

  <rect x="172" y="64" width="116" height="52" rx="8" fill="#f6f8fc" stroke="#2563eb"/>
  <text x="230" y="86" text-anchor="middle" font-size="11.5" fill="#1a1a24">Design doc</text>
  <text x="230" y="103" text-anchor="middle" font-size="10" fill="#2563eb">full text indexed</text>

  <rect x="314" y="64" width="116" height="52" rx="8" fill="#f6f8fc" stroke="#2563eb"/>
  <text x="372" y="86" text-anchor="middle" font-size="11.5" fill="#1a1a24">Test report</text>
  <text x="372" y="103" text-anchor="middle" font-size="10" fill="#2563eb">full text indexed</text>

  <rect x="456" y="64" width="116" height="52" rx="8" fill="#f6f8fc" stroke="#7d9de0"/>
  <text x="514" y="86" text-anchor="middle" font-size="11.5" fill="#1a1a24">Dashboard</text>
  <text x="514" y="103" text-anchor="middle" font-size="10" fill="#6a80b0">text truncated</text>

  <rect x="642" y="64" width="116" height="52" rx="8" fill="#fafafa" stroke="#c0c0c8" stroke-dasharray="4 3"/>
  <text x="700" y="86" text-anchor="middle" font-size="11.5" fill="#8a8a96">Unrelated page</text>
  <text x="700" y="103" text-anchor="middle" font-size="10" fill="#8a8a96">not in corpus</text>

  <!-- edges -->
  <path d="M148,90 L170,90" fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow-bg-l)"/>
  <path d="M290,90 L312,90" fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow-bg-l)"/>
  <path d="M432,90 L454,90" fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arrow-bg-l)"/>
  <path d="M574,90 L640,90" fill="none" stroke="#b0b0bc" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-bg-dim-l)"/>

  <!-- gate -->
  <line x1="607" y1="34" x2="607" y2="150" stroke="#c05050" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="607" y="166" text-anchor="middle" font-size="10" fill="#a04040" font-weight="600">CORPUS GATE</text>
  <text x="607" y="180" text-anchor="middle" font-size="9.5" fill="#a04040">max generation</text>

  <!-- one number, three jobs -->
  <text x="30" y="222" font-size="10.5" fill="#6a6a78" font-weight="600" letter-spacing="0.06em">ONE NUMBER, THREE JOBS</text>
  <line x1="30" y1="232" x2="760" y2="232" stroke="#d8d8e0"/>

  <rect x="30" y="248" width="230" height="112" rx="8" fill="#f6f8fc" stroke="#9aa0b4"/>
  <text x="48" y="274" font-size="11.5" fill="#1a1a24" font-weight="600">1 · Discovery</text>
  <text x="48" y="298" font-size="10.5" fill="#4a4a5a">What do we fetch next? The</text>
  <text x="48" y="314" font-size="10.5" fill="#4a4a5a">frontier of generation N tells</text>
  <text x="48" y="330" font-size="10.5" fill="#4a4a5a">the crawler where to go, and</text>
  <text x="48" y="346" font-size="10.5" fill="#4a4a5a">when to stop.</text>

  <rect x="280" y="248" width="230" height="112" rx="8" fill="#f6f8fc" stroke="#9aa0b4"/>
  <text x="298" y="274" font-size="11.5" fill="#1a1a24" font-weight="600">2 · Trust boundary</text>
  <text x="298" y="298" font-size="10.5" fill="#4a4a5a">Distance from an accepted</text>
  <text x="298" y="314" font-size="10.5" fill="#4a4a5a">source decides membership —</text>
  <text x="298" y="330" font-size="10.5" fill="#4a4a5a">and how much of a document</text>
  <text x="298" y="346" font-size="10.5" fill="#4a4a5a">earns space in the index.</text>

  <rect x="530" y="248" width="230" height="112" rx="8" fill="#f6f8fc" stroke="#9aa0b4"/>
  <text x="548" y="274" font-size="11.5" fill="#1a1a24" font-weight="600">3 · Ranking feature</text>
  <text x="548" y="298" font-size="10.5" fill="#4a4a5a">Σ 1 / (1 + generation) over</text>
  <text x="548" y="314" font-size="10.5" fill="#4a4a5a">incoming links: an authority</text>
  <text x="548" y="330" font-size="10.5" fill="#4a4a5a">score you can explain to the</text>
  <text x="548" y="346" font-size="10.5" fill="#4a4a5a">person who disagrees with it.</text>

  <text x="30" y="386" font-size="10" fill="#6a6a78" font-style="italic">No graph database required: the traversal is bounded, the refresh is batch, and every query the serving system asks was answered in advance.</text>
</svg>
